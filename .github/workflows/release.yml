name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Build, test and generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Determine version
        id: version
        run: |
          version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo 'Expected a version tag such as v1.0.0 or v1.0.0-rc.1.' >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore locked dependencies
        run: dotnet restore PurlMaster.sln --locked-mode

      - name: Build Release configuration
        run: dotnet build PurlMaster.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PurlMaster.sln --configuration Release --no-build --no-restore

      - name: Install CycloneDX generator
        # 5.5.0 supports the project's .NET 9 runtime and explicit 1.6 output.
        run: dotnet tool install CycloneDX --version 5.5.0 --tool-path "$RUNNER_TEMP/cyclonedx"

      - name: Generate and validate CycloneDX 1.6 SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          filename="purl-master-${VERSION}.cdx.json"
          "$RUNNER_TEMP/cyclonedx/dotnet-CycloneDX" src/PurlMaster/PurlMaster.csproj \
            --framework net9.0 --disable-package-restore --exclude-dev \
            --output-format Json --spec-version 1.6 \
            --set-name purl-master --set-version "$VERSION" \
            --output artifacts --filename "$filename"
          jq -e --arg version "$VERSION" '
            .bomFormat == "CycloneDX" and .specVersion == "1.6" and
            .metadata.component.name == "purl-master" and
            .metadata.component.version == $version
          ' "artifacts/$filename"
          # The application validates against its embedded CycloneDX schema.
          dotnet src/PurlMaster/bin/Release/net9.0/purl-master.dll "artifacts/$filename" \
            --output "$RUNNER_TEMP/validated-sbom.json"
          (cd artifacts && sha256sum "$filename" > "$filename.sha256")

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purl-master-sbom
          path: artifacts/*
          if-no-files-found: error

  package:
    name: Package ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: ubuntu-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Publish application
        run: |
          dotnet publish src/PurlMaster --configuration Release \
            --runtime "$RID" --no-self-contained \
            --property:Version="$VERSION" \
            --output "$RUNNER_TEMP/publish"
          cp README.md "$RUNNER_TEMP/publish/README.md"

      - name: Verify published files and smoke test
        run: |
          for file in LICENSE purl-master.dll purl-master.deps.json purl-master.runtimeconfig.json; do
            test -f "$RUNNER_TEMP/publish/$file"
          done
          for schema in bom-1.2.schema.json bom-1.3.schema.json bom-1.4.schema.json bom-1.5.schema.json bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            cmp "docs/schemas/$schema" "$RUNNER_TEMP/publish/Schemas/$schema"
          done
          dotnet "$RUNNER_TEMP/publish/purl-master.dll" --help
          dotnet "$RUNNER_TEMP/publish/purl-master.dll" docs/test-bom.1.6.json \
            --output "$RUNNER_TEMP/smoke-test.json"
          if [[ "$RID" != win-* ]]; then
            "$RUNNER_TEMP/publish/purl-master" --help
          fi

      - name: Create archive and checksum
        run: |
          mkdir -p artifacts
          if [[ "$RID" == win-* ]]; then
            archive="purl-master-${VERSION}-${RID}.zip"
            (cd "$RUNNER_TEMP/publish" && zip -r "$GITHUB_WORKSPACE/artifacts/$archive" .)
          else
            archive="purl-master-${VERSION}-${RID}.tar.gz"
            tar -czf "artifacts/$archive" -C "$RUNNER_TEMP/publish" .
          fi
          if command -v sha256sum > /dev/null 2>&1; then
            (cd artifacts && sha256sum "$archive" > "$archive.sha256")
          else
            (cd artifacts && shasum -a 256 "$archive" > "$archive.sha256")
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purl-master-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: purl-master-* # Application archives and the SBOM artifact.
          path: dist
          merge-multiple: true

      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && cat *.sha256 > SHA256SUMS && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes \
              --title "PurlMaster $RELEASE_TAG" "${flags[@]}"
          fi
